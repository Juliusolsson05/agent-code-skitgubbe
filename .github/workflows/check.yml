name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # The two-browser LAN acceptance renders two WebGL scenes in software; give the
    # slowest observed runner room without letting a wedged job hang for 6 hours.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:lan-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
